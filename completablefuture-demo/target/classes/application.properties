spring.application.name=completablefuture-demo
server.port=8080

# Show concise logs so it's easy to see parallel vs sequential timing in console
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{20} - %msg%n
logging.level.com.coffee.cfdemo=INFO

management.endpoints.web.exposure.include=health,info
